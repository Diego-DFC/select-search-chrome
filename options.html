<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Select Search Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    input[type="number"] {
      width: 80px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    
    select {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      max-width: 300px;
    }
    
    button {
      background-color: #0060df;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    button:hover {
      background-color: #003eaa;
    }
    
    .status {
      margin-bottom: 16px;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }
    
    .success {
      background-color: #e6f4ea;
      color: #137333;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Select Search Options</h1>
  
  <div id="status" class="status"></div>
  
  <form id="options-form">
    <div class="form-group">
      <label for="min-options">Minimum number of options to activate search:</label>
      <input type="number" id="min-options" min="1" max="1000">
      <p>The search functionality will only be added to select dropdowns with at least this many options.</p>
    </div>
    
    <div class="form-group">
      <label for="max-results">Maximum number of search results to show:</label>
      <input type="number" id="max-results" min="1" max="100">
      <p>The maximum number of matching options to display in the search results.</p>
    </div>
    
    <div class="form-group">
      <label for="website-mode">Website Mode:</label>
      <select id="website-mode">
        <option value="all">Run on all websites</option>
        <option value="include">Run only on specified websites</option>
        <option value="exclude">Run on all except specified websites</option>
      </select>
    </div>
    
    <div class="form-group" id="websites-container">
      <label for="websites">Websites (one per line):</label>
      <textarea id="websites" rows="5" style="width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
      <p>Enter domain names without protocol (e.g., "example.com" not "https://example.com").</p>
    </div>
    
    <button type="submit">Save Settings</button>
  </form>
  
  <script src="options.js"></script>
</body>
</html>
